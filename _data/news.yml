  text: 'My Ph.D. dissertation "Navigating Mixed Traffic: Lateral and Longitudinal Control for Connected and Autonomous Vehicles with a Human-Centric Approach" received the 2025 Best Dissertation Award from the Chinese Overseas Transportation Association (COTA).'

