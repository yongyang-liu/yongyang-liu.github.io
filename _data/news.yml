- date: "May 2025"
  text: 'Our paper "[Human-Like Lane-Change Control Strategy for Connected and Autonomous Vehicles to Improve Interactions with Human-Driven Vehicles](https://doi.org/10.1016/j.trc.2025.105211)" is accepted and published in *Transportation Research Part C*.'

