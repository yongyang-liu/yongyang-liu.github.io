{% if page.url == "/" %}
  {% assign seo_title = site.title | append: " | " | append: site.lab_name %}
{% else %}
  {% assign seo_title = page.title | append: " | " | append: site.title %}
{% endif %}
{% assign seo_description = page.description | default: site.description %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ seo_title | escape }}</title>
<meta name="description" content="{{ seo_description | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ seo_title | escape }}">
<meta property="og:description" content="{{ seo_description | escape }}">
<meta property="og:image" content="{{ '/images/logo/starlab-og.png' | absolute_url }}">
<meta property="og:image:alt" content="STARLab — Socially Intelligent Autonomy, Reasoning, and Learning Laboratory">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/lab.css' | relative_url }}">
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/images/favicon-192x192.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">
<meta name="theme-color" content="#ffffff">
