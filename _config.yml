# STARLab website — Jekyll configuration
# Built and published by GitHub Pages from the master branch.
# Restart `jekyll serve` after editing this file.

# Site identity
locale      : "en-US"
title       : "STARLab"
lab_name    : "Socially Intelligent Autonomy, Reasoning, and Learning Lab"
description : "STARLab (Socially Intelligent Autonomy, Reasoning, and Learning Lab) at Tennessee Technological University advances AI, robotics, and intelligent autonomous systems."
url         : https://yongyang-liu.github.io
baseurl     : ""

# Lab contact (used in the footer and on People / Join Us)
lab:
  university : "Tennessee Technological University"
  department : "Department of Mechanical and Nuclear Engineering"
  pi_name    : "Dr. Yongyang Liu"
  email      : "yliu@tntech.edu"

# Build settings
markdown    : kramdown
highlighter : rouge
kramdown:
  input          : GFM
  hard_wrap      : false
  auto_ids       : true
  entity_output  : as_char
  smart_quotes   : lsquo,rsquo,ldquo,rdquo

sass:
  style : compressed

include:
  - _pages

exclude:
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - node_modules
  - vendor
  - .bundle

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: lab

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

timezone: America/Chicago
